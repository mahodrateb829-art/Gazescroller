name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          if [ -f GazeScroller-android-project.zip ]; then
            unzip -o GazeScroller-android-project.zip -d .
            ls -la GazeScroller
          else
            echo "GazeScroller-android-project.zip not found in repo root"
            ls -la
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: GazeScroller
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: GazeScroller/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
